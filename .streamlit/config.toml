[server]
maxUploadSize = 2000

# ─────────────────────────────────────────────────────────────────────────────
# BTN Anchor Dashboard — Light Theme (BTN Anchor Design System)
#
#   primaryColor          → BTN Blue  (#1B59F8 — nav active, buttons)
#   backgroundColor       → Off-white canvas (#F9F9F9)
#   secondaryBackgroundColor → White widget surface (#FFFFFF)
#   textColor             → Near-black (#000000)
#   font                  → "sans serif" (overridden to Roboto via CSS @import)
#
# The app's Python toggle (theme_mode in session_state) re-injects themed
# CSS variables on top, enabling a smooth light/dark switch.
# ─────────────────────────────────────────────────────────────────────────────
[theme]
primaryColor            = "#1B59F8"
backgroundColor         = "#F9F9F9"
secondaryBackgroundColor = "#FFFFFF"
textColor               = "#000000"
font                    = "sans serif"
